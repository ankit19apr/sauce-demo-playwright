# Workflow name displayed in GitHub Actions
name: Playwright Tests

# Run on pushes, pull requests, or manual execution
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------
  # JOB 1: Run UI tests in four parallel shards
  # --------------------------------------------------
  test:
    name: Playwright UI Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint code quality check
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright UI shard
        run: >-
          npx playwright test
          --project=chromium
          --project=firefox
          --project=webkit
          --shard=${{ matrix.shard }}/4
        env:
          CI: true

      # Upload reports even when tests fail
      - name: Upload UI blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload UI Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.shard }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  # --------------------------------------------------
  # JOB 2: Run API and authentication tests
  # --------------------------------------------------
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Authentication and Posts API tests
        run: >-
          npx playwright test
          --project=auth-api
          --project=api
        env:
          CI: true
          AUTH_API_USERNAME: ${{ secrets.AUTH_API_USERNAME }}
          AUTH_API_PASSWORD: ${{ secrets.AUTH_API_PASSWORD }}

      - name: Upload API blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload API Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  # --------------------------------------------------
  # JOB 3: Consolidate Playwright and Allure reports
  # --------------------------------------------------
  merge-reports:
    name: Merge Playwright and Allure Reports
    runs-on: ubuntu-latest
    needs: [test, api-tests]

    # Run after failures too, unless the workflow is cancelled
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------- Playwright HTML ----------------

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Check for Playwright blob results
        id: playwright-results
        shell: bash
        run: |
          if find all-blob-reports -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Playwright blob reports were found."
          fi

      - name: Generate consolidated Playwright HTML report
        if: ${{ steps.playwright-results.outputs.available == 'true' }}
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload consolidated Playwright report
        if: ${{ !cancelled() && steps.playwright-results.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      # ---------------- Allure HTML ----------------

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Check for Allure results
        id: allure-results
        shell: bash
        run: |
          if find all-allure-results -type f -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Allure test result files were found."
          fi

      - name: Generate consolidated Allure report
        if: ${{ steps.allure-results.outputs.available == 'true' }}
        run: npx allure generate ./all-allure-results --output ./allure-report --clean

      - name: Upload consolidated Allure report
        if: ${{ !cancelled() && steps.allure-results.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 14
