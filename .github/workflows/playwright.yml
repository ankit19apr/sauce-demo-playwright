
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Playwright UI Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Node.js and npm caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Check TypeScript for errors
      - name: TypeScript type check
        run: npm run typecheck

      # Check code quality with ESLint
      - name: ESLint code quality check
        run: npm run lint

      # Install browsers and system dependencies for UI tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run only the UI browser projects in this shard.
      # Update these project names if your config uses different names.
      - name: Run Playwright UI shard
        run: >-
          npx playwright test
          --project=chromium
          --project=firefox
          --project=webkit
          --shard=${{ matrix.shard }}/4
        env:
          CI: true

      # Upload each UI shard's mergeable blob report
      - name: Upload UI blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run both API projects without installing browser binaries.
      - name: Run Authentication and Posts API tests
        run: >-
          npx playwright test
          --project=auth-api
          --project=api
        env:
          CI: true
          AUTH_API_USERNAME: ${{ secrets.AUTH_API_USERNAME }}
          AUTH_API_PASSWORD: ${{ secrets.AUTH_API_PASSWORD }}

      # Keep API results available for the consolidated report.
      - name: Upload API blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    name: Merge Playwright Reports
    runs-on: ubuntu-latest

    # Wait for both UI shards and API tests before merging.
    needs: [test, api-tests]

    # Attempt report merging even if tests fail, unless cancelled.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download UI and API blob reports.
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # Merge test results into one HTML report.
      - name: Merge reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      # Upload the consolidated HTML report.
      - name: Upload consolidated HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
