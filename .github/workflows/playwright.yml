name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Playwright Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Node.js and npm caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Check TypeScript for errors
      - name: TypeScript type check
        run: npm run typecheck

      # Check code quality with ESLint
      - name: ESLint code quality check
        run: npm run lint
        
      # Install Chromium, Firefox, WebKit and system dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Execute this shard of the test suite
      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: true

      # Upload each shard's mergeable blob report
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    name: Merge Playwright Reports
    runs-on: ubuntu-latest

    needs: test

    # Attempt report merging even if a shard fails
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download the reports from all shard jobs
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # Merge the reports into a single HTML report
      - name: Merge reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      # Upload the consolidated report
      - name: Upload consolidated HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
